name: sqflite_example
description: Demonstrates how to use the sqflite plugin and perform some tests.
publish_to: none
version: '0.4.0'

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  path: any
  collection: any
  flutter:
    sdk: flutter
  sqflite:
  sqflite_common:
  synchronized:
  matcher:
  meta:
  sqflite_helper:
    # When depending on this package from a real application you should use:
    #   sqflite_helper: ^x.y.z
    # See https://dart.dev/tools/pub/dependencies#version-constraints
    # The example app is bundled with the plugin so we use a path dependency on
    # the parent directory to use the current plugin's version.
    # path: /Users/liaochengjin/Documents/lzb/sqflite_helper/
    git:
      url: https://gitcode.com/openharmony-sig/flutter_samples.git
      path: ohos/sqflite_helper
      ref: master

dev_dependencies:
  flutter_lints: '>=2.0.0'
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  test:
  process_run: '>=0.11.0+2'
  pub_semver: 

# For information on the generic Dart part of this file, see the
# following page: https://www.dartlang.org/tools/pub/pubspec

# The following section is specific to Flutter.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section here, in
  # this "flutter" section, as in:
  # assets:
  #  - images/a_dot_burr.jpeg
  #  - images/a_dot_ham.jpeg
  assets:
    - assets/example.db
    - assets/issue_64.db

dependency_overrides:
  sqflite:
    path: ../
  sqflite_common:
    path: ../../sqflite_common
